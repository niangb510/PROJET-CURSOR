<!DOCTYPE html>
<html lang="fr">

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-99KJJ0E8LY"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-99KJJ0E8LY');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | N'Baye Niang</title>
    <meta name="description" content="Contactez N'Baye Niang pour des opportunités ou collaborations.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💼</text></svg>">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="N'Baye Niang">
    <meta property="og:url" content="https://portefoliobaye.netlify.app/contact.html">
    <meta property="og:title" content="Contact | N'Baye Niang">
    <meta property="og:description" content="Contactez N'Baye Niang pour des opportunités ou collaborations.">
    <meta name="twitter:card" content="summary_large_image">
    <meta property="og:image" content="https://portefoliobaye.netlify.app/image_profil.png">
    <link rel="canonical" href="https://portefoliobaye.netlify.app/contact.html">
    <script>
        (function() {
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (saved === 'dark' || (!saved && prefersDark)) {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>
</head>

<body>

    <div id="app">
        <header class="header" id="site-header"></header>

        <main>
            <section id="contact" class="contact container section-padding reveal">
                <h1 class="section-title typewriter-title">Me Contacter</h1>
                <div class="contact__grid">
                    <div class="contact__info">
                        <p>Disponible pour de nouvelles opportunités ou collaborations.</p>
                        <div class="contact__links">
                            <a href="mailto:niangaffou@gmail.com" aria-label="Envoyer un email"><i class="fas fa-envelope" aria-hidden="true"></i>
                                niangaffou@gmail.com</a>
                            <a href="https://www.linkedin.com/in/baye-niang-677981" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><i
                                    class="fab fa-linkedin" aria-hidden="true"></i> LinkedIn</a>
                            <a href="https://github.com/niangb510" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><i class="fab fa-github" aria-hidden="true"></i>
                                GitHub</a>
                        </div>
                    </div>
                    <form id="contact-form" class="contact__form">
                        <div class="form__group">
                            <label for="name">Nom</label>
                            <input type="text" id="name" name="name" required placeholder="Votre nom">
                        </div>
                        <div class="form__group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required placeholder="votre@email.com">
                        </div>
                        <div class="form__group">
                            <label for="message">Message</label>
                            <textarea id="message" name="message" required placeholder="Votre message..."></textarea>
                        </div>
                        <button type="submit" class="btn btn--primary">Envoyer</button>
                        <div id="form-status" class="form-status hidden"></div>
                    </form>
                </div>
            </section>
        </main>

        <footer class="footer">
            <div class="container">
                <div class="footer__socials">
                    <a href="https://www.linkedin.com/in/baye-niang-677981" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
                    <a href="https://github.com/niangb510" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><i class="fab fa-github"></i></a>
                    <a href="mailto:niangaffou@gmail.com" aria-label="Email"><i class="fas fa-envelope"></i></a>
                </div>
            </div>
        </footer>
    </div>
    <script type="module" src="/src/scripts/main.js"></script>
</body>

</html>
