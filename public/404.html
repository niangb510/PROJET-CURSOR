<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable | N'Baye Niang</title>
    <meta name="description" content="La page demandée n'existe pas ou a été déplacée.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#000000">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            color-scheme: dark;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #000;
            background-image: radial-gradient(#242424 1px, transparent 1px);
            background-size: 28px 28px;
            color: #e9e9e7;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .shell {
            width: 100%;
            max-width: 1264px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .site-header {
            border-bottom: 1px solid #1c1c1c;
            padding: 1.5rem 0;
        }

        .brand {
            font-family: 'JetBrains Mono', 'Cascadia Mono', Consolas, monospace;
            font-size: 0.85rem;
            color: #ff5a5a;
        }

        main {
            display: flex;
            flex: 1;
            align-items: center;
            padding: 5rem 0;
        }

        .label {
            font-family: 'JetBrains Mono', 'Cascadia Mono', Consolas, monospace;
            font-size: 0.75rem;
            letter-spacing: 0.08em;
            color: #858585;
        }

        .label span {
            margin-right: 0.5rem;
            color: #ff5a5a;
        }

        h1 {
            margin-top: 1.1rem;
            font-family: 'JetBrains Mono', 'Cascadia Mono', Consolas, monospace;
            font-size: clamp(2.2rem, 6vw, 3.8rem);
            font-weight: 500;
            line-height: 1.05;
            letter-spacing: -0.04em;
            color: #f4f4f2;
        }

        .lead {
            max-width: 32rem;
            margin-top: 1.5rem;
            font-size: 1rem;
            line-height: 1.8;
            color: #a6a6a6;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.9rem;
            margin-top: 2.2rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            padding: 0.85rem 1.3rem;
            border: 1px solid #2a2a2a;
            border-radius: 2px;
            font-family: 'JetBrains Mono', 'Cascadia Mono', Consolas, monospace;
            font-size: 0.8rem;
            color: #e9e9e7;
            transition: border-color 0.2s ease, color 0.2s ease, background-color 0.2s ease;
        }

        .btn:hover,
        .btn:focus-visible {
            border-color: #ff5a5a;
            color: #ff5a5a;
            outline: none;
        }

        .btn--primary {
            border-color: #ff5a5a;
            background: #ff5a5a;
            color: #1a0707;
        }

        .btn--primary:hover,
        .btn--primary:focus-visible {
            background: #ff7b7b;
            border-color: #ff7b7b;
            color: #1a0707;
        }

        .site-footer {
            border-top: 1px solid #1c1c1c;
            padding: 1.75rem 0;
            font-family: 'JetBrains Mono', 'Cascadia Mono', Consolas, monospace;
            font-size: 0.72rem;
            color: #858585;
        }
    </style>
</head>

<body>
    <header class="site-header">
        <div class="shell">
            <a class="brand" href="/">n'baye@portfolio</a>
        </div>
    </header>

    <main id="contenu">
        <div class="shell">
            <p class="label"><span aria-hidden="true">//</span>erreur 404</p>
            <h1>Page introuvable</h1>
            <p class="lead">Cette adresse n'existe pas ou a été déplacée. Les anciennes pages sont désormais regroupées
                sur l'accueil.</p>
            <div class="actions">
                <a class="btn btn--primary" href="/">[ retour à l'accueil ]</a>
                <a class="btn" href="/#projets">[ voir mes projets ]</a>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="shell">© 2025 N'Baye Niang</div>
    </footer>
</body>

</html>
